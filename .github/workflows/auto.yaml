name: Auto

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Lint (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        # Each directory is a separate Go module.
        module: [".", zerologmgr, logrusmgr, examples]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test -race ./...

      - name: Run lint
        run: go vet ./...

      - name: Run coverage
        run: go test -coverprofile=coverage.out ./...
